services:
  tasks-api:
    build: services/tasks-api
    ports:
      - "5001:5000"
    environment:
      NORMALIZER_URL: http://title-normalizer:5001

  title-normalizer:
    build: services/title-normalizer
    ports:
      - "5002:5001"
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
        - ./prometheus:/etc/prometheus:ro
  grafana:
    image: grafana/grafana:13.3.1
    ports:
      - "3000:3000"

